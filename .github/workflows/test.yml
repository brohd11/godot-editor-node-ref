# Tests this package with PackageExporter: its suites, as pushed, against its requires at their
# tags. One Godot job is enough: godot_versions_test.gd fans out to every other supported version.
name: test
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    uses: brohd11/godot-package-exporter/.github/workflows/package-test.yml@main
    with:
      godot-versions: '["4.7.2-stable"]'
